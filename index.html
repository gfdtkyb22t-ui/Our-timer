<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naman ♡ Julia — Our Time</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff0f6,#ffd7e9,#f9e6ff);font-family:system-ui,-apple-system,sans-serif;color:#793b63;display:grid;place-items:center;overflow:hidden}.card{position:relative;z-index:1;width:min(92vw,520px);background:#ffffffb8;backdrop-filter:blur(12px);border:1px solid white;border-radius:28px;padding:36px 22px;text-align:center;box-shadow:0 18px 60px #ad648340}h1{font-size:clamp(27px,7vw,42px);margin:10px 0;color:#b83d7b}.subtitle{font-size:15px;letter-spacing:.08em}.date{font-size:14px;margin:20px 0}.timer{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.unit{background:#fff3fa;border-radius:17px;padding:18px 4px;border:1px solid #fbd1e4}.number{font-weight:800;font-size:clamp(25px,7vw,40px);font-variant-numeric:tabular-nums;color:#b73e79}.label{font-size:12px;margin-top:5px}.message{margin-top:25px;line-height:1.5}.heart{position:fixed;bottom:-40px;animation:float linear infinite;opacity:.45;pointer-events:none}@keyframes float{to{transform:translateY(-115vh) rotate(35deg);opacity:0}}@media(max-width:360px){.card{padding:26px 12px}.unit{padding:13px 2px}}</style></head><body><main class="card"><div class="subtitle">OUR LITTLE FOREVER ♡</div><h1>Naman ♡ Julia</h1><p>Every moment with you matters.</p><div class="date">Since 19 June 2026 · 12:43 PM (UK time)</div><section class="timer" aria-label="Time together"><div class="unit"><div class="number" id="months">0</div><div class="label">Months</div></div><div class="unit"><div class="number" id="days">0</div><div class="label">Days</div></div><div class="unit"><div class="number" id="hours">00</div><div class="label">Hours</div></div><div class="unit"><div class="number" id="minutes">00</div><div class="label">Minutes</div></div><div class="unit"><div class="number" id="seconds">00</div><div class="label">Seconds</div></div><div class="unit"><div class="number">∞</div><div class="label">Memories to make</div></div></section><div class="message">And I'd choose you all over again. ♡</div></main><script>const start=Date.parse('2026-06-19T12:43:00+01:00');const pad=n=>String(n).padStart(2,'0');function update(){let now=Date.now();if(now<start){return}const current=new Date(now);const s=new Date(start);let months=(current.getUTCFullYear()-s.getUTCFullYear())*12+current.getUTCMonth()-s.getUTCMonth();function anniversary(m){const y=s.getUTCFullYear(),mo=s.getUTCMonth()+m;const first=new Date(Date.UTC(y,mo,1,s.getUTCHours(),s.getUTCMinutes(),s.getUTCSeconds()));const last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();first.setUTCDate(Math.min(s.getUTCDate(),last));return first.getTime()}while(anniversary(months)>now)months--;while(anniversary(months+1)<=now)months++;let remaining=Math.floor((now-anniversary(months))/1000);const days=Math.floor(remaining/86400);remaining%=86400;const hours=Math.floor(remaining/3600);remaining%=3600;const minutes=Math.floor(remaining/60);const seconds=remaining%60;for(const [id,value] of Object.entries({months,days,hours:pad(hours),minutes:pad(minutes),seconds:pad(seconds)}))document.getElementById(id).textContent=value}update();setInterval(update,1000);for(let i=0;i<23;i++){let h=document.createElement('span');h.className='heart';h.textContent=['♡','♥','💕'][i%3];h.style.left=Math.random()*100+'vw';h.style.fontSize=(12+Math.random()*25)+'px';h.style.animationDuration=(8+Math.random()*13)+'s';h.style.animationDelay=(-Math.random()*20)+'s';document.body.appendChild(h)}</script></body></html>
